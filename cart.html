<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>校园食堂 - 购物车</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --primary-light: #FF8C42;
            --yellow: #FFD93D;
            --orange: #FF6B35;
            --bg-page: #FFF8E7;
            --bg-card: #FFFFFF;
            --text-primary: #3D2914;
            --text-secondary: #8B7355;
            --text-tertiary: #A89078;
            --price: #FF6B6B;
            --border: #FFE4B5;
            --tag-bg: #FFF3E0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(180deg, var(--yellow) 0%, var(--orange) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 180px;
        }

        /* 顶部导航 */
        .header {
            background: var(--primary);
            color: white;
            padding: 16px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        /* 空购物车 */
        .empty-cart {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 20px;
            text-align: center;
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .empty-text {
            font-size: 16px;
            color: var(--text-tertiary);
            margin-bottom: 24px;
        }

        .empty-btn {
            padding: 12px 32px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .empty-btn:active {
            opacity: 0.8;
        }

        /* 购物车列表 */
        .cart-list {
            padding: 12px 16px;
        }

        .cart-item {
            display: flex;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .cart-item img {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            object-fit: cover;
        }

        .cart-item-info {
            flex: 1;
            margin-left: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cart-item-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .cart-item-canteen {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }

        .cart-item-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cart-item-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--price);
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quantity-btn {
            width: 32px;
            height: 32px;
            background: var(--bg-page);
            border: none;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .quantity-btn:active {
            background: var(--border);
        }

        .quantity-num {
            font-size: 16px;
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }

        /* 备注输入 */
        .note-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            margin: 0 16px 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .note-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .note-input {
            width: 100%;
            height: 60px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        .note-input:focus {
            border-color: var(--primary);
        }

        /* 订单摘要 */
        .order-summary {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            margin: 0 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 14px;
        }

        .summary-row:not(:last-child) {
            border-bottom: 1px solid var(--border);
        }

        .summary-label {
            color: var(--text-secondary);
        }

        .summary-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        .summary-total {
            font-size: 18px;
            font-weight: 700;
            color: var(--price);
        }

        /* 底部结算栏 */
        .bottom-bar {
            position: fixed;
            bottom: 60px;
            left: 0;
            right: 0;
            background: var(--bg-card);
            padding: 16px;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.1);
        }

        .bottom-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .total-info {
            display: flex;
            flex-direction: column;
        }

        .total-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .total-price {
            font-size: 22px;
            font-weight: 700;
            color: var(--price);
        }

        .checkout-btn {
            padding: 14px 40px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .checkout-btn:active {
            opacity: 0.8;
        }

        .checkout-btn:disabled {
            background: var(--text-tertiary);
            cursor: not-allowed;
        }

        /* 下单成功弹窗 */
        .success-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-modal.active {
            display: flex;
        }

        .success-content {
            width: 100%;
            max-width: 300px;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            animation: scaleIn 0.3s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 16px;
        }

        .success-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .success-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .success-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-card);
            display: flex;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.08);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-decoration: none;
            color: var(--text-tertiary);
            font-size: 12px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 24px;
        }

        /* 提示消息 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 16px 32px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 400;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 响应式 */
        @media (max-width: 360px) {
            .cart-item img {
                width: 70px;
                height: 70px;
            }
        }

        /* 增强响应式布局 - 适配各种手机屏幕 */
        @media (max-width: 320px) {
            .cart-item img {
                width: 60px;
                height: 60px;
            }
            
            .cart-item-name {
                font-size: 13px;
            }
            
            .cart-item-price {
                font-size: 14px;
            }
        }

        @media (min-width: 361px) and (max-width: 414px) {
            .cart-item img {
                width: 75px;
                height: 75px;
            }
        }

        @media (min-width: 415px) and (max-width: 768px) {
            .cart-item img {
                width: 85px;
                height: 85px;
            }
        }

        /* 确保图片不变形 */
        img {
            max-width: 100%;
            height: auto;
            object-fit: cover;
        }

        /* 确保文字不溢出 */
        .cart-item-name, .cart-item-desc {
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /* 确保按钮可点击 */
        button, .nav-item {
            min-height: 44px;
            min-width: 44px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <h1>🛒 购物车</h1>
    </header>

    <!-- 购物车内容 -->
    <div id="cartContent">
        <!-- 空购物车 -->
        <div class="empty-cart" id="emptyCart">
            <div class="empty-icon">🛒</div>
            <div class="empty-text">购物车空空如也</div>
            <button class="empty-btn" onclick="location.href='index.html'">去点餐</button>
        </div>

        <!-- 购物车列表 -->
        <div class="cart-list" id="cartList" style="display: none;"></div>

        <!-- 备注 -->
        <div class="note-section" id="noteSection" style="display: none;">
            <div class="note-label">备注</div>
            <textarea class="note-input" id="orderNote" placeholder="口味、忌口等要求..."></textarea>
        </div>

        <!-- 订单摘要 -->
        <div class="order-summary" id="orderSummary" style="display: none;">
            <div class="summary-row">
                <span class="summary-label">商品总价</span>
                <span class="summary-value" id="goodsTotal">¥0.00</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">配送费</span>
                <span class="summary-value">¥0.00</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">实付金额</span>
                <span class="summary-total" id="actualTotal">¥0.00</span>
            </div>
        </div>
    </div>

    <!-- 底部结算栏 -->
    <div class="bottom-bar" id="bottomBar" style="display: none;">
        <div class="bottom-content">
            <div class="total-info">
                <span class="total-label">共 <span id="totalCount">0</span> 件</span>
                <span class="total-price" id="totalPrice">¥0.00</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn">去结算</button>
        </div>
    </div>

    <!-- 下单成功弹窗 -->
    <div class="success-modal" id="successModal">
        <div class="success-content">
            <div class="success-icon">✅</div>
            <div class="success-title">下单成功！</div>
            <div class="success-desc">感谢您的点餐，请耐心等待</div>
            <button class="success-btn" onclick="location.href='index.html'">继续点餐</button>
        </div>
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>首页</span>
        </a>
        <a href="cart.html" class="nav-item active" id="cartNav">
            <span class="nav-icon">🛒</span>
            <span>购物车</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="nav-icon">👤</span>
            <span>我的</span>
        </a>
    </nav>

    <script>
        // 获取购物车数据
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // 渲染购物车
        function renderCart() {
            const emptyCart = document.getElementById('emptyCart');
            const cartList = document.getElementById('cartList');
            const noteSection = document.getElementById('noteSection');
            const orderSummary = document.getElementById('orderSummary');
            const bottomBar = document.getElementById('bottomBar');
            const cartNav = document.getElementById('cartNav');

            if (cart.length === 0) {
                emptyCart.style.display = 'flex';
                cartList.style.display = 'none';
                noteSection.style.display = 'none';
                orderSummary.style.display = 'none';
                bottomBar.style.display = 'none';
                cartNav.innerHTML = `
                    <span class="nav-icon">🛒</span>
                    <span>购物车</span>
                `;
                return;
            }

            emptyCart.style.display = 'none';
            cartList.style.display = 'block';
            noteSection.style.display = 'block';
            orderSummary.style.display = 'block';
            bottomBar.style.display = 'block';

            // 渲染购物车列表
            cartList.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.name}">
                    <div class="cart-item-info">
                        <div>
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-canteen">${item.canteen === 'east' ? '东食堂' : '西食堂'}</div>
                        </div>
                        <div class="cart-item-bottom">
                            <div class="cart-item-price">¥${item.price}</div>
                            <div class="quantity-control">
                                <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">-</button>
                                <span class="quantity-num">${item.quantity}</span>
                                <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            // 更新统计
            updateSummary();

            // 更新购物车导航
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartNav.innerHTML = `
                <span class="nav-icon">🛒<span style="position:absolute;top:-4px;right:-8px;background:#ff6b6b;color:white;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;">${totalCount}</span></span>
                <span>购物车</span>
            `;
        }

        // 更新数量
        function updateQuantity(index, delta) {
            cart[index].quantity += delta;
            
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        // 更新统计
        function updateSummary() {
            const goodsTotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);

            document.getElementById('goodsTotal').textContent = `¥${goodsTotal.toFixed(2)}`;
            document.getElementById('actualTotal').textContent = `¥${goodsTotal.toFixed(2)}`;
            document.getElementById('totalCount').textContent = totalCount;
            document.getElementById('totalPrice').textContent = `¥${goodsTotal.toFixed(2)}`;
        }

        // 结算
        document.getElementById('checkoutBtn').addEventListener('click', () => {
            if (cart.length === 0) {
                showToast('购物车为空');
                return;
            }

            // 保存订单到历史
            const order = {
                id: 'ORD' + Date.now(),
                items: [...cart],
                note: document.getElementById('orderNote').value,
                total: cart.reduce((sum, item) => sum + item.price * item.quantity, 0),
                time: new Date().toLocaleString(),
                status: 'pending'
            };

            // 获取历史订单
            let orderHistory = JSON.parse(localStorage.getItem('orderHistory')) || [];
            orderHistory.unshift(order);
            localStorage.setItem('orderHistory', JSON.stringify(orderHistory));

            // 清空购物车
            localStorage.removeItem('cart');
            cart = [];

            // 显示成功弹窗
            document.getElementById('successModal').classList.add('active');
        });

        // 显示提示
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>
</html>
