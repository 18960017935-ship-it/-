<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>校园食堂 - 首页点餐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --primary-light: #FF8C42;
            --yellow: #FFD93D;
            --orange: #FF6B35;
            --bg-page: #FFF8E7;
            --bg-card: #FFFFFF;
            --text-primary: #3D2914;
            --text-secondary: #8B7355;
            --text-tertiary: #A89078;
            --price: #FF6B6B;
            --border: #FFE4B5;
            --tag-bg: #FFF3E0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(180deg, var(--yellow) 0%, var(--orange) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* 顶部导航 */
        .header {
            background: var(--primary);
            color: white;
            padding: 16px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        /* 搜索栏 */
        .search-bar {
            padding: 12px 16px;
            background: var(--bg-card);
            display: flex;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .search-input {
            flex: 1;
            height: 40px;
            padding: 0 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .filter-btn {
            height: 40px;
            padding: 0 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .filter-btn:active {
            opacity: 0.8;
        }

        /* 食堂切换选项卡 */
        .canteen-tabs {
            display: flex;
            background: var(--bg-card);
            padding: 0 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .canteen-tab {
            flex: 1;
            height: 48px;
            border: none;
            background: none;
            font-size: 15px;
            color: var(--text-secondary);
            position: relative;
            cursor: pointer;
            transition: color 0.3s;
        }

        .canteen-tab.active {
            color: var(--primary);
            font-weight: 600;
        }

        .canteen-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* 分类选项卡 */
        .category-tabs {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            background: var(--bg-card);
            margin-bottom: 8px;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .category-tab {
            padding: 6px 16px;
            background: var(--bg-page);
            border: none;
            border-radius: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-tab.active {
            background: var(--primary);
            color: white;
        }

        /* 菜品列表 */
        .dish-list {
            padding: 0 16px;
        }

        .dish-card {
            display: flex;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: transform 0.3s;
        }

        .dish-card:active {
            transform: scale(0.98);
        }

        .dish-image {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
        }

        .dish-info {
            flex: 1;
            margin-left: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dish-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .dish-desc {
            font-size: 12px;
            color: var(--text-tertiary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .dish-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }

        .dish-rating {
            color: var(--price);
            font-weight: 500;
        }

        .dish-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dish-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--price);
        }

        .dish-original {
            font-size: 12px;
            color: var(--text-tertiary);
            text-decoration: line-through;
            margin-left: 4px;
        }

        .favorite-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: none;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
        }

        .favorite-btn:hover {
            transform: scale(1.1);
        }

        .favorite-btn.active {
            color: #FF6B6B;
        }

        /* 收藏区域样式 */
        .favorites-section {
            margin: 16px;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .favorites-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .favorites-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .favorites-count {
            background: var(--orange);
            color: white;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .favorites-clear {
            font-size: 12px;
            color: var(--text-tertiary);
            cursor: pointer;
        }

        .favorites-list {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .favorites-item {
            flex-shrink: 0;
            width: 80px;
            text-align: center;
            cursor: pointer;
        }

        .favorites-item-image {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 4px;
        }

        .favorites-item-name {
            font-size: 12px;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .favorites-empty {
            text-align: center;
            padding: 20px;
            color: var(--text-tertiary);
            font-size: 14px;
        }

        .add-btn {
            width: 36px;
            height: 36px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .add-btn:active {
            opacity: 0.8;
        }

        /* 标签 */
        .dish-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 2px 8px;
            background: var(--tag-bg);
            color: var(--primary);
            border-radius: 4px;
            font-size: 10px;
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-card);
            display: flex;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.08);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-decoration: none;
            color: var(--text-tertiary);
            font-size: 12px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 24px;
        }

        /* 筛选弹窗 */
        .filter-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: none;
        }

        .filter-modal.active {
            display: block;
        }

        .filter-content {
            position: absolute;
            top: 0;
            right: 0;
            width: 280px;
            height: 100%;
            background: var(--bg-card);
            padding: 20px;
            overflow-y: auto;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .filter-title {
            font-size: 18px;
            font-weight: 600;
        }

        .filter-close {
            width: 32px;
            height: 32px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .filter-section {
            margin-bottom: 20px;
        }

        .filter-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-option {
            padding: 8px 16px;
            background: var(--bg-page);
            border: 1px solid var(--border);
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-option.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .filter-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .filter-btn-cancel,
        .filter-btn-confirm {
            flex: 1;
            height: 44px;
            border: none;
            border-radius: 22px;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .filter-btn-cancel {
            background: var(--bg-page);
            color: var(--text-secondary);
        }

        .filter-btn-confirm {
            background: var(--primary);
            color: white;
        }

        /* 下单弹窗 */
        .order-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .order-modal.active {
            display: flex;
        }

        .order-content {
            width: 100%;
            max-width: 340px;
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            animation: scaleIn 0.3s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .order-header {
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .order-header h3 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .order-header p {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .order-body {
            padding: 16px;
        }

        .order-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-item img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }

        .order-item-info {
            flex: 1;
        }

        .order-item-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .order-item-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--price);
        }

        .order-quantity {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quantity-btn {
            width: 28px;
            height: 28px;
            background: var(--bg-page);
            border: none;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .quantity-btn:active {
            background: var(--border);
        }

        .quantity-num {
            font-size: 16px;
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }

        .order-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .order-total-label {
            font-size: 15px;
            color: var(--text-secondary);
        }

        .order-total-price {
            font-size: 22px;
            font-weight: 700;
            color: var(--price);
        }

        .order-submit {
            width: 100%;
            height: 48px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .order-submit:active {
            opacity: 0.8;
        }

        /* 提示消息 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 16px 32px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 400;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* 响应式 */
        @media (max-width: 360px) {
            .dish-image {
                width: 80px;
                height: 80px;
            }
            
            .dish-name {
                font-size: 14px;
            }
        }

        /* 增强响应式布局 - 适配各种手机屏幕 */
        @media (max-width: 320px) {
            /* 超小屏幕适配 */
            .dish-image {
                width: 70px;
                height: 70px;
            }
            
            .dish-name {
                font-size: 13px;
            }
            
            .dish-desc {
                font-size: 11px;
            }
            
            .dish-price {
                font-size: 16px;
            }
            
            .category-tab {
                padding: 6px 10px;
                font-size: 12px;
            }
            
            .canteen-tab {
                padding: 8px 12px;
                font-size: 13px;
            }
        }

        @media (min-width: 361px) and (max-width: 414px) {
            /* 中等屏幕适配 */
            .dish-image {
                width: 90px;
                height: 90px;
            }
        }

        @media (min-width: 415px) and (max-width: 768px) {
            /* 大屏手机适配 */
            .dish-image {
                width: 100px;
                height: 100px;
            }
            
            .dish-name {
                font-size: 16px;
            }
        }

        /* 确保图片不变形 */
        img {
            max-width: 100%;
            height: auto;
            object-fit: cover;
        }

        /* 确保文字不溢出 */
        .dish-name, .dish-desc {
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /* 确保按钮可点击 */
        button, .nav-item, .category-tab, .canteen-tab {
            min-height: 44px;
            min-width: 44px;
        }

        /* 新增：点餐品类统计模块 */
        .stats-module {
            margin: 0 16px 16px;
            background: white;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.15);
        }

        .stats-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px dashed #FFE4B5;
        }

        .stats-icon {
            font-size: 24px;
        }

        .stats-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .stats-content {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .pie-chart-container {
            flex-shrink: 0;
        }

        .pie-chart {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(
                #FF6B35 0deg 126deg,
                #FF8C42 126deg 216deg,
                #FFD93D 216deg 270deg,
                #FFB347 270deg 313.2deg,
                #FFE4B5 313.2deg 342deg,
                #FFB6C1 342deg 360deg
            );
            position: relative;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.2);
        }

        .pie-chart::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stats-legend {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .legend-name {
            color: var(--text-secondary);
            flex: 1;
        }

        .legend-percent {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* 响应式：小屏幕适配 */
        @media (max-width: 360px) {
            .stats-content {
                flex-direction: column;
                align-items: center;
            }

            .pie-chart {
                width: 100px;
                height: 100px;
            }

            .pie-chart::after {
                width: 50px;
                height: 50px;
            }

            .stats-legend {
                width: 100%;
            }
        }

        /* 新增：顶部视频模块 */
        .video-hero-section {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
            margin-bottom: -40px;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
            background: linear-gradient(135deg, #FFE4B5 0%, #FFB347 100%);
        }

        .video-player-wrapper {
            width: 100%;
            height: 100%;
        }

        .video-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .video-icon {
            font-size: 50px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .video-text {
            font-size: 14px;
            color: var(--text-primary);
            margin-top: 8px;
            font-weight: 500;
        }

        /* 新增：卡通饭团IP - 左上角位置 */
        .mascot-container {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 90px;
            height: 90px;
            animation: float 3s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .mascot-body {
            position: absolute;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #FFF8DC 0%, #FFE4B5 100%);
            border-radius: 50% 50% 45% 45%;
            top: 10px;
            left: 10px;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .mascot-rice {
            position: absolute;
            width: 50px;
            height: 22px;
            background: linear-gradient(180deg, #FFF8DC 0%, #FFEFD5 100%);
            border-radius: 50%;
            top: -12px;
            left: 20px;
            box-shadow: inset 0 -3px 6px rgba(0, 0, 0, 0.1);
        }

        .mascot-face {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            text-align: center;
        }

        .mascot-eyes {
            display: flex;
            justify-content: center;
            gap: 9px;
            margin-bottom: 3px;
        }

        .mascot-eye {
            width: 8px;
            height: 11px;
            background: var(--text-primary);
            border-radius: 50%;
            position: relative;
            animation: blink 4s infinite;
        }

        @keyframes blink {
            0%, 90%, 100% { height: 11px; }
            95% { height: 1px; }
        }

        .mascot-eye::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            top: 2px;
            right: 1px;
        }

        .mascot-mouth {
            width: 12px;
            height: 6px;
            background: var(--orange);
            border-radius: 0 0 6px 6px;

    <script>
        // 菜品数据
        const dishes = [
            { id: 1, name: '红烧肉盖饭', desc: '精选五花肉，慢炖2小时', price: 15, originalPrice: 18, canteen: 'east', category: 'cover', rating: 4.8, sales: 1256, tags: ['hot', 'special'], image: 'https://picsum.photos/id/292/200/200' },
            { id: 2, name: '宫保鸡丁', desc: '经典川菜，鸡肉嫩滑', price: 14, canteen: 'east', category: 'stir-fry', rating: 4.6, sales: 892, tags: [], image: 'https://picsum.photos/id/312/200/200' },
            { id: 3, name: '番茄鸡蛋面', desc: '新鲜番茄，酸甜可口', price: 10, canteen: 'east', category: 'noodle', rating: 4.5, sales: 756, tags: ['cheap'], image: 'https://picsum.photos/id/326/200/200' },
            { id: 4, name: '糖醋里脊', desc: '外酥里嫩，酸甜适中', price: 16, canteen: 'east', category: 'stir-fry', rating: 4.7, sales: 1024, tags: ['hot'], image: 'https://picsum.photos/id/401/200/200' },
            { id: 5, name: '麻辣香锅', desc: '多种食材，麻辣鲜香', price: 22, canteen: 'east', category: 'special', rating: 4.4, sales: 678, tags: ['special'], image: 'https://picsum.photos/id/431/200/200' },
            { id: 6, name: '黄焖鸡米饭', desc: '鸡肉鲜嫩，汤汁浓郁', price: 16, originalPrice: 20, canteen: 'west', category: 'cover', rating: 4.9, sales: 1456, tags: ['hot', 'special'], image: 'https://picsum.photos/id/835/200/200' },
            { id: 7, name: '鱼香肉丝', desc: '经典川菜，酸甜微辣', price: 13, canteen: 'west', category: 'stir-fry', rating: 4.6, sales: 978, tags: [], image: 'https://picsum.photos/id/1080/200/200' },
            { id: 8, name: '重庆小面', desc: '麻辣鲜香，地道重庆味', price: 12, canteen: 'west', category: 'noodle', rating: 4.7, sales: 834, tags: ['special'], image: 'https://picsum.photos/id/292/200/200' },
            { id: 9, name: '回锅肉', desc: '五花肉配蒜苗', price: 15, canteen: 'west', category: 'stir-fry', rating: 4.5, sales: 1123, tags: ['hot'], image: 'https://picsum.photos/id/312/200/200' },
            { id: 10, name: '扬州炒饭', desc: '虾仁火腿，营养丰富', price: 12, canteen: 'west', category: 'cover', rating: 4.4, sales: 1234, tags: ['cheap'], image: 'https://picsum.photos/id/326/200/200' }
        ];

        // 状态
        let currentCanteen = 'east';
        let currentCategory = 'all';
        let currentFilter = { price: 'all', tag: 'all' };
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // 渲染菜品列表
        function renderDishes() {
            const dishList = document.getElementById('dishList');
            let filtered = dishes.filter(d => d.canteen === currentCanteen);
            
            // 分类筛选
            if (currentCategory !== 'all') {
                filtered = filtered.filter(d => {
                    const categoryMap = { 'cover': 'cover', 'stir-fry': 'stir-fry', 'noodle': 'noodle', 'special': 'special' };
                    return d.category === categoryMap[currentCategory];
                });
            }

            // 价格筛选
            if (currentFilter.price !== 'all') {
                filtered = filtered.filter(d => {
                    if (currentFilter.price === '0-10') return d.price < 10;
                    if (currentFilter.price === '10-15') return d.price >= 10 && d.price <= 15;
                    if (currentFilter.price === '15-20') return d.price > 15 && d.price <= 20;
                    if (currentFilter.price === '20+') return d.price > 20;
                    return true;
                });
            }

            // 标签筛选
            if (currentFilter.tag !== 'all') {
                filtered = filtered.filter(d => d.tags.includes(currentFilter.tag));
            }

            // 搜索筛选
            const searchValue = document.getElementById('searchInput').value.toLowerCase();
            if (searchValue) {
                filtered = filtered.filter(d => d.name.toLowerCase().includes(searchValue));
            }

            dishList.innerHTML = filtered.map(dish => {
                const isFavorite = checkFavorite(dish.id);
                return `
                <div class="dish-card" onclick="showOrderModal(${dish.id})">
                    <img class="dish-image" src="${dish.image}" alt="${dish.name}">
                    <div class="dish-info">
                        <div>
                            <div class="dish-name">${dish.name}</div>
                            <div class="dish-desc">${dish.desc}</div>
                            <div class="dish-meta">
                                <span class="dish-rating">★ ${dish.rating}</span>
                                <span>月售 ${dish.sales}</span>
                            </div>
                            <div class="dish-tags">
                                ${dish.tags.map(tag => `<span class="tag">${{'hot': '热销', 'special': '特色', 'cheap': '实惠'}[tag] || tag}</span>`).join('')}
                            </div>
                        </div>
                        <div class="dish-bottom">
                            <div>
                                <span class="dish-price">¥${dish.price}</span>
                                ${dish.originalPrice ? `<span class="dish-original">¥${dish.originalPrice}</span>` : ''}
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <button class="favorite-btn ${isFavorite ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite(${dish.id})">♥</button>
                                <button class="add-btn" onclick="event.stopPropagation(); addToCart(${dish.id})">+</button>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            // 更新购物车数量
            updateCartBadge();
        }

        // 添加到购物车
        function addToCart(id) {
            const dish = dishes.find(d => d.id === id);
            const existingItem = cart.find(item => item.id === id);
            
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...dish, quantity: 1 });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            showToast('已加入购物车');
        }

        // 更新购物车徽章
        function updateCartBadge() {
            const cartNav = document.getElementById('cartNav');
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartNav.innerHTML = `
                <span class="nav-icon">🛒${totalCount > 0 ? `<span style="position:absolute;top:-4px;right:-8px;background:#ff6b6b;color:white;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;">${totalCount}</span>` : ''}</span>
                <span>购物车</span>
            `;
        }

        // 显示订单弹窗
        function showOrderModal(id) {
            const dish = dishes.find(d => d.id === id);
            const orderBody = document.getElementById('orderBody');
            const orderModal = document.getElementById('orderModal');
            const orderTotal = document.getElementById('orderTotal');
            
            let quantity = 1;
            
            orderBody.innerHTML = `
                <div class="order-item">
                    <img src="${dish.image}" alt="${dish.name}">
                    <div class="order-item-info">
                        <div class="order-item-name">${dish.name}</div>
                        <div class="order-item-price">¥${dish.price}</div>
                    </div>
                    <div class="order-quantity">
                        <button class="quantity-btn" onclick="updateQuantity(-1)">-</button>
                        <span class="quantity-num" id="modalQuantity">${quantity}</span>
                        <button class="quantity-btn" onclick="updateQuantity(1)">+</button>
                    </div>
                </div>
            `;

            orderTotal.textContent = `¥${(dish.price * quantity).toFixed(2)}`;
            orderModal.classList.add('active');

            // 保存当前操作的菜品
            window.currentDish = dish;
            window.modalQuantity = quantity;

            // 数量更新函数
            window.updateQuantity = function(delta) {
                quantity = Math.max(1, quantity + delta);
                document.getElementById('modalQuantity').textContent = quantity;
                window.modalQuantity = quantity;
                orderTotal.textContent = `¥${(dish.price * quantity).toFixed(2)}`;
            };
        }

        // 关闭订单弹窗
        function closeOrderModal() {
            document.getElementById('orderModal').classList.remove('active');
        }

        // 收藏功能
        function getFavorites() {
            return JSON.parse(localStorage.getItem('favorites') || '[]');
        }

        function checkFavorite(dishId) {
            const favorites = getFavorites();
            return favorites.includes(dishId);
        }

        function toggleFavorite(dishId) {
            const favorites = getFavorites();
            const index = favorites.indexOf(dishId);
            
            if (index > -1) {
                favorites.splice(index, 1);
                localStorage.setItem('favorites', JSON.stringify(favorites));
                showToast('已取消收藏');
            } else {
                favorites.push(dishId);
                localStorage.setItem('favorites', JSON.stringify(favorites));
                showToast('已添加收藏');
            }
            
            renderDishes();
            renderFavorites();
        }

        function clearFavorites() {
            localStorage.removeItem('favorites');
            renderFavorites();
            renderDishes();
            showToast('已清空收藏');
        }

        function renderFavorites() {
            const favorites = getFavorites();
            const favoritesSection = document.getElementById('favoritesSection');
            const favoritesList = document.getElementById('favoritesList');
            const favoritesCount = document.getElementById('favoritesCount');
            
            if (favorites.length === 0) {
                favoritesSection.style.display = 'none';
                return;
            }
            
            favoritesSection.style.display = 'block';
            favoritesCount.textContent = favorites.length;
            
            const favoriteDishes = favorites.map(id => dishes.find(d => d.id === id)).filter(Boolean);
            
            favoritesList.innerHTML = favoriteDishes.map(dish => `
                <div class="favorites-item" onclick="showOrderModal(${dish.id})">
                    <img class="favorites-item-image" src="${dish.image}" alt="${dish.name}">
                    <div class="favorites-item-name">${dish.name}</div>
                </div>
            `).join('');
        }

        // 提交订单
        function submitOrder() {
            if (window.currentDish && window.modalQuantity) {
                addToCartWithQuantity(window.currentDish.id, window.modalQuantity);
                closeOrderModal();
            }
        }

        function addToCartWithQuantity(id, quantity) {
            const dish = dishes.find(d => d.id === id);
            const existingItem = cart.find(item => item.id === id);
            
            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                cart.push({ ...dish, quantity: quantity });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            showToast(`已添加 ${quantity} 份到购物车`);
        }

        // 显示提示
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
        }

        // 事件监听
        document.addEventListener('DOMContentLoaded', () => {
            renderDishes();
            renderFavorites();

            // 新增：假登录功能
            const loginFloatBtn = document.getElementById('loginFloatBtn');
            const loginModalNew = document.getElementById('loginModalNew');
            const loginCloseNew = document.getElementById('loginCloseNew');
            const loginFormNew = document.getElementById('loginFormNew');

            // 打开登录弹窗
            loginFloatBtn.addEventListener('click', () => {
                loginModalNew.classList.add('active');
            });

            // 关闭登录弹窗
            loginCloseNew.addEventListener('click', () => {
                loginModalNew.classList.remove('active');
            });

            // 点击弹窗外部关闭
            loginModalNew.addEventListener('click', (e) => {
                if (e.target === loginModalNew) {
                    loginModalNew.classList.remove('active');
                }
            });

            // 登录表单提交
            loginFormNew.addEventListener('submit', (e) => {
                e.preventDefault();
                const username = document.getElementById('loginUsername').value;
                const password = document.getElementById('loginPassword').value;

                if (!username || !password) {
                    showToast('请输入用户名和密码');
                    return;
                }

                // 模拟登录成功
                showToast(`🎉 欢迎回来，${username}！`);
                loginModalNew.classList.remove('active');
                loginFloatBtn.innerHTML = '<span>✓</span>';
                loginFloatBtn.style.background = 'linear-gradient(135deg, #66BB6A 0%, #4CAF50 100%)';
            });

            // 头像点击放大预览
            const avatarClick = document.getElementById('avatarClick');
            const avatarModal = document.getElementById('avatarModal');
            const avatarModalClose = document.getElementById('avatarModalClose');

            // 点击头像打开弹窗
            avatarClick.addEventListener('click', () => {
                avatarModal.classList.add('active');
            });

            // 点击关闭按钮关闭弹窗
            avatarModalClose.addEventListener('click', () => {
                avatarModal.classList.remove('active');
            });

            // 点击弹窗外部关闭
            avatarModal.addEventListener('click', (e) => {
                if (e.target === avatarModal) {
                    avatarModal.classList.remove('active');
                }
            });

            // 食堂选项卡切换
            document.querySelectorAll('.canteen-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.canteen-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentCanteen = tab.dataset.canteen;
                    renderDishes();
                });
            });

            // 分类选项卡切换
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentCategory = tab.dataset.category;
                    renderDishes();
                });
            });

            // 筛选按钮
            document.getElementById('filterBtn').addEventListener('click', () => {
                document.getElementById('filterModal').classList.add('active');
            });

            // 关闭筛选弹窗
            document.getElementById('filterClose').addEventListener('click', () => {
                document.getElementById('filterModal').classList.remove('active');
            });

            document.getElementById('filterCancel').addEventListener('click', () => {
                document.querySelectorAll('.filter-option').forEach(opt => opt.classList.remove('active'));
                document.querySelectorAll('.filter-option[data-price="all"]')[0].classList.add('active');
                document.querySelectorAll('.filter-option[data-tag="all"]')[0].classList.add('active');
                currentFilter = { price: 'all', tag: 'all' };
            });

            document.getElementById('filterConfirm').addEventListener('click', () => {
                const priceOpt = document.querySelector('.filter-option[data-price].active');
                const tagOpt = document.querySelector('.filter-option[data-tag].active');
                currentFilter = {
                    price: priceOpt ? priceOpt.dataset.price : 'all',
                    tag: tagOpt ? tagOpt.dataset.tag : 'all'
                };
                document.getElementById('filterModal').classList.remove('active');
                renderDishes();
            });

            // 筛选选项点击
            document.querySelectorAll('.filter-option[data-price]').forEach(opt => {
                opt.addEventListener('click', () => {
                    document.querySelectorAll('.filter-option[data-price]').forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                });
            });

            document.querySelectorAll('.filter-option[data-tag]').forEach(opt => {
                opt.addEventListener('click', () => {
                    document.querySelectorAll('.filter-option[data-tag]').forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                });
            });

            // 搜索
            document.getElementById('searchInput').addEventListener('input', renderDishes);

            // 订单弹窗关闭
            document.getElementById('orderModal').addEventListener('click', (e) => {
                if (e.target.id === 'orderModal') {
                    closeOrderModal();
                }
            });

            // 提交订单
            document.getElementById('orderSubmit').addEventListener('click', submitOrder);
        });
    </script>
</body>
</html>
